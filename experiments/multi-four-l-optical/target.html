<!doctype html><html><head><title>Multiple four-L optical test</title><style>body{margin:0;background:#777;overflow:hidden}canvas{width:100vw;height:100vh}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');window.testStart=performance.now();function card(cx,cy,w,h,a){g.save();g.translate(cx,cy);g.rotate(a);g.fillStyle='#fff';g.fillRect(-w*.56,-h*.6,w*1.12,h*1.2);g.lineWidth=Math.min(w,h)*.038;g.strokeStyle='#000';g.lineCap='butt';let l=Math.min(w,h)*.19;for(let i=0;i<4;i++){let x=(i===0||i===3)?-w/2:w/2,y=i<2?-h/2:h/2,sx=x<0?1:-1,sy=y<0?1:-1;g.beginPath();g.moveTo(x+sx*l,y);g.lineTo(x,y);g.lineTo(x,y+sy*l);g.stroke()}g.restore()};function draw(){c.width=innerWidth;c.height=innerHeight;let t=(performance.now()-testStart)/1000;g.fillStyle='#777';g.fillRect(0,0,c.width,c.height);let n=t<12||t>=25?2:4;let ph=t<6?'two-static':t<12?'two-motion':t<18?'four-static':t<25?'four-motion':'overlap';let move=ph.endsWith('motion');for(let i=0;i<n;i++){let cross=t>=25?Math.max(0,Math.sin((t-25)/8*Math.PI)):0;let cx=c.width*((i%2===0?.17:.39)+(i%2===0?1:-1)*.11*cross);let cy=c.height*(n===2?.7:(i<2?.52:.80));let dx=move?.012*c.width*Math.sin(t*.9+i):0;let dy=move?.012*c.height*Math.cos(t*.8+i):0;card(cx+dx,cy+dy,c.width*.16,c.height*.20,move?.10*Math.sin(t+i):0)}window.frameState={t,n,ph};requestAnimationFrame(draw)}draw();
</script></body></html>
