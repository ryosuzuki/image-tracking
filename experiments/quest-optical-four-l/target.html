<!doctype html><html><head><title>Four-L optical screen test</title><style>body{margin:0;background:white;overflow:hidden}canvas{width:100vw;height:100vh}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),g=c.getContext('2d');window.testStart=performance.now();window.frameState={};function draw(){c.width=innerWidth;c.height=innerHeight;let t=(performance.now()-testStart)/1000;let phase=Math.floor(t/8)%4;let a=phase===1?.22*Math.sin(t*1.5):0,dx=phase===2?.13*c.width*Math.sin(t):0,sk=phase===3?.18*Math.sin(t):0;g.fillStyle='white';g.fillRect(0,0,c.width,c.height);g.save();g.translate(c.width*.5+dx,c.height*.5);g.rotate(a);g.transform(1,0,sk,1,0,0);let w=c.width*.6,h=c.height*.58,l=Math.min(w,h)*.16;g.strokeStyle='black';g.lineWidth=Math.min(w,h)*.035;g.lineCap='butt';for(let i=0;i<4;i++){let x=(i===0||i===3)?-w/2:w/2,y=i<2?-h/2:h/2,sx=x<0?1:-1,sy=y<0?1:-1;g.beginPath();g.moveTo(x+sx*l,y);g.lineTo(x,y);g.lineTo(x,y+sy*l);g.stroke()}g.restore();window.frameState={t,phase,angle:a,translation:dx,skew:sk};requestAnimationFrame(draw)}draw();
</script></body></html>
