<!doctype html><html><meta charset="utf-8"><title>Native Quest Target Presenter</title><style>html,body{margin:0;background:#f4f4f4;width:100%;height:100%;overflow:hidden}#target{position:absolute;width:62vw;height:88vh;object-fit:contain;left:19vw;top:6vh;transform-origin:center;transition:transform .25s}#note{position:absolute;bottom:1px;left:10px;color:#333;font:16px sans-serif}</style><img id="target" src="assets/target.png"><div id="note">Quest native image target — actual monitor stimulus</div><script>window.stage=(name)=>{let im=document.querySelector('#target');im.style.visibility=name==='hidden'?'hidden':'visible';im.style.transform=({'left':'translateX(-8vw)','right':'translateX(8vw)','rotate':'rotate(10deg)','small':'scale(.8)','baseline':'none','hidden':'none'})[name]||'none';return {name,rect:im.getBoundingClientRect().toJSON(),time:Date.now()}};</script></html>
