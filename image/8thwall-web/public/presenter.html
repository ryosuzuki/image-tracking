<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math targets · Presenter</title><style>*{box-sizing:border-box}body{margin:0;background:#1b2430;color:white;font:16px system-ui;text-align:center}header{height:110px;padding:12px}h1{font-size:20px;margin:0 0 10px}button,select,input,a{font:inherit;margin:3px;padding:8px;border:0;border-radius:6px}a{color:#71eeec}#card{width:95vw;height:auto;max-height:calc(100vh - 180px);max-width:95vw;object-fit:contain;filter:brightness(.65)}footer{font-size:12px;height:25px}#interval{width:60px}.compact header{height:50px;padding:3px}.compact h1{font-size:12px;margin:0}.compact button,.compact select,.compact input,.compact a{font-size:12px;padding:4px;margin:2px}.compact #card{max-height:none;max-width:none}.compact footer{font-size:10px}</style></head><body><header><h1 id="title">Loading targets…</h1><button id="prev">← Previous</button><select id="choose" aria-label="Target"></select><button id="next">Next →</button><button id="auto">Auto advance</button><label><input id="interval" type="number" min="4" max="60" value="5"> seconds</label><label>Brightness <input id="brightness" type="range" min="0.05" max="1" step="0.01" value="0.65" style="width:75px"></label><button id="full">Fullscreen</button><a href="/">Mobile tracker</a></header><img id="card" alt="Tracking target"><footer>Arrow keys: switch · Space: auto advance · F: fullscreen</footer><script type="module" src="/presenter.js"></script></body></html>
