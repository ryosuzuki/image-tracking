<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10 QR paper targets</title><style>body{font:18px system-ui;background:#ddd;margin:12px}main{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.paper{background:white;position:relative;padding:18px;text-align:center;border:1px solid #aaa}.paper:before,.paper:after{content:"";position:absolute;width:14px;height:14px;border-color:black;border-style:solid}.paper:before{left:5px;top:5px;border-width:4px 0 0 4px}.paper:after{right:5px;bottom:5px;border-width:0 4px 4px 0}img{width:100%;max-width:230px}button{font:inherit;padding:10px}body.single main{grid-template-columns:1fr;max-width:600px;margin:auto}body.single .paper{display:none}body.single .paper.selected{display:block}@media print{button,p{display:none}}</style><button onclick="document.body.classList.toggle('single')">一覧／1枚</button><button onclick="next()">次のID</button><p>黒L字は配置見本。今の認識器はQRだけを読みます。各QRの白い余白は残してください。</p><main><section class="paper selected"><h2>Paper 001</h2><img src="cards/paper-001.png"><p>中身は自由に変更可能</p></section><section class="paper "><h2>Paper 002</h2><img src="cards/paper-002.png"><p>中身は自由に変更可能</p></section><section class="paper "><h2>Paper 003</h2><img src="cards/paper-003.png"><p>中身は自由に変更可能</p></section><section class="paper "><h2>Paper 004</h2><img src="cards/paper-004.png"><p>中身は自由に変更可能</p></section><section class="paper "><h2>Paper 005</h2><img src="cards/paper-005.png"><p>中身は自由に変更可能</p></section><section class="paper "><h2>Paper 006</h2><img src="cards/paper-006.png"><p>中身は自由に変更可能</p></section><section class="paper "><h2>Paper 007</h2><img src="cards/paper-007.png"><p>中身は自由に変更可能</p></section><section class="paper "><h2>Paper 008</h2><img src="cards/paper-008.png"><p>中身は自由に変更可能</p></section><section class="paper "><h2>Paper 009</h2><img src="cards/paper-009.png"><p>中身は自由に変更可能</p></section><section class="paper "><h2>Paper 010</h2><img src="cards/paper-010.png"><p>中身は自由に変更可能</p></section></main><script>let n=0;function next(){const p=[...document.querySelectorAll('.paper')];p[n].classList.remove('selected');n=(n+1)%p.length;p[n].classList.add('selected')}</script>
