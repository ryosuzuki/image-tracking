<!doctype html><html lang="en"><meta charset="utf-8"><title>Three real-paper image checks</title><h1>Real first-page images · synthetic camera checks</h1><p>This verifies image matching, not physical-camera accuracy or WebXR anchoring.</p><pre id="report">Loading…</pre><iframe src="index.html?preset=papers" width="1000" height="650"></iframe><script type="module">
const f=document.querySelector('iframe');await new Promise(r=>f.onload=r);while(!f.contentWindow.registeredPaper)await new Promise(r=>setTimeout(r,100));const api=f.contentWindow.registeredPaper,results=[],targets=[];function check(name,canvas,expected){const matches=api.recognize(canvas),hits=matches.map(x=>x.item.id).sort();results.push({name,hits,expected,pass:JSON.stringify(hits)===JSON.stringify([...expected].sort()),scores:matches.map(x=>({id:x.item.id,score:x.score,margin:x.margin}))});}for(const item of api.catalog){const image=new f.contentWindow.Image();image.src=item.image;await image.decode();const c=f.contentDocument.createElement('canvas');api.drawTarget(c,item,image);targets.push(c);check(item.label+' authentic first page',c,[item.id]);const p=f.contentDocument.createElement('canvas');p.width=1000;p.height=1100;const x=p.getContext('2d');x.fillStyle='#888';x.fillRect(0,0,p.width,p.height);x.translate(500,550);x.rotate(.10);x.drawImage(c,-320,-440);check(item.label+' rotated 6 degrees',p,[item.id]);}for(const width of [2020,1280]){const p=f.contentDocument.createElement('canvas');p.width=width;p.height=Math.round(width*920/2020);const x=p.getContext('2d');x.fillStyle='#777';x.fillRect(0,0,p.width,p.height);const scale=width/2020;x.scale(scale,scale);targets.forEach((c,i)=>x.drawImage(c,20+i*660,20));check('Three real papers at '+width+'px',p,api.catalog.map(x=>x.id));}const unknown=f.contentDocument.createElement('canvas');api.drawTarget(unknown,{label:'UNKNOWN',symbol:'?'});check('Unregistered image rejected',unknown,[]);document.querySelector('#report').textContent=JSON.stringify(results,null,2);window.results=results;
</script></html>
