<!doctype html><html lang="en"><meta charset="utf-8"><title>Registered Paper Synthetic Checks</title><h1>Synthetic checks (not physical accuracy)</h1><pre id="report">Loading…</pre><iframe id="app" src="index.html" width="960" height="650"></iframe><script type="module">
const f=document.querySelector('iframe');await new Promise(r=>f.onload=r);while(!f.contentWindow.registeredPaper)await new Promise(r=>setTimeout(r,200));const api=f.contentWindow.registeredPaper,results=[];function check(name,canvas,expected){const hits=api.recognize(canvas).map(x=>x.item.id).sort();const pass=JSON.stringify(hits)===JSON.stringify([...expected].sort());results.push({name,hits,expected,pass});}for(const item of api.catalog){const c=f.contentDocument.createElement('canvas');api.drawTarget(c,item);check(item.id+' digital reference',c,[item.id]);const p=f.contentDocument.createElement('canvas');p.width=800;p.height=600;const x=p.getContext('2d');x.fillStyle='#888';x.fillRect(0,0,800,600);x.save();x.translate(400,300);x.rotate(.10);x.drawImage(c,-320,-220);x.restore();check(item.id+' rotated 6 degrees',p,[item.id]);}const triple=f.contentDocument.createElement('canvas');triple.width=2020;triple.height=480;const tx=triple.getContext('2d');tx.fillStyle='#777';tx.fillRect(0,0,2020,480);api.catalog.forEach((item,i)=>{const c=f.contentDocument.createElement('canvas');api.drawTarget(c,item);tx.drawImage(c,20+i*660,20);});check('three simultaneous sheets',triple,api.catalog.map(x=>x.id));const unknown=f.contentDocument.createElement('canvas');api.drawTarget(unknown,{label:'UNKNOWN',symbol:'?'});check('unregistered page rejected',unknown,[]);const blank=f.contentDocument.createElement('canvas');api.drawTarget(blank,{label:'',symbol:''});check('blank page rejected',blank,[]);const page=f.contentDocument.createElement('canvas');page.width=400;page.height=600;const pc=page.getContext('2d');pc.fillStyle='white';pc.fillRect(0,0,400,600);pc.fillStyle='black';pc.font='bold 30px Arial';pc.fillText('Paper Alpha',30,50);pc.font='14px Arial';for(let y=100;y<570;y+=25)pc.fillText('Synthetic paper layout '+y,20,y);pc.fillRect(100,180,190,100);const blob=await new Promise(r=>page.toBlob(r));const dt=new f.contentWindow.DataTransfer();dt.items.add(new f.contentWindow.File([blob],'synthetic-first-page.png',{type:'image/png'}));f.contentDocument.querySelector('#label').value='paper-alpha';const field=f.contentDocument.querySelector('#reference');field.files=dt.files;field.dispatchEvent(new f.contentWindow.Event('change'));let attempts=0;while(api.registry.length!==4&&attempts++<50)await new Promise(r=>setTimeout(r,100));const item=api.catalog.at(-1),image=new f.contentWindow.Image();image.src=item.image;await image.decode();const target=f.contentDocument.createElement('canvas');api.drawTarget(target,item,image);check('uploaded dense first-page fixture',target,['paper-alpha']);document.querySelector('#report').textContent=JSON.stringify(results,null,2);window.results=results;
</script></html>
