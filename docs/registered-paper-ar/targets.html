<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registered Paper Targets · v1</title><style>body{background:#445064;color:white;text-align:center;font:18px system-ui}button,select,input{font:inherit;padding:10px;margin:5px}#sheets{display:flex;gap:20px;justify-content:center;align-items:center;min-height:70vh}canvas{width:90%;max-height:85vh;object-fit:contain;background:white}#sheets.three canvas{width:30%}#sheets:fullscreen{background:#445064;width:100vw;height:100vh}a{color:#7dd3fc}</style><h1>MacBook Air: registered image targets</h1><select id="select"></select><button id="full">Fullscreen</button><button id="download">Download selected PNG</button><label>Import the same catalog JSON: <input id="import" type="file" accept="application/json"></label><div id="sheets"></div><p><a href="index.html">Pixel / Quest recognition page</a></p><script type="module">
import {defaults,drawTarget} from './catalog.mjs';let items=defaults.map(x=>({...x}));const select=document.querySelector('#select'),sheets=document.querySelector('#sheets');async function draw(){sheets.replaceChildren();const list=select.value==='all'?items:items.filter(x=>x.id===select.value);sheets.className=list.length>1?'three':'';for(const item of list){const c=document.createElement('canvas');let image;if(item.image){image=new Image();image.src=item.image;await image.decode();}drawTarget(c,item,image);sheets.append(c);}}function options(){select.replaceChildren();for(const item of items)select.add(new Option(item.label,item.id));select.add(new Option('Three / all sheets','all'));draw();}select.onchange=draw;document.querySelector('#full').onclick=()=>sheets.requestFullscreen();document.querySelector('#download').onclick=()=>{const a=document.createElement('a');a.download='registered-paper-target.png';a.href=sheets.querySelector('canvas').toDataURL();a.click();};document.querySelector('#import').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data)||!data.length||data.length>20)throw Error('Expected 1–20 references');items=data;options();}catch(e){alert(e.message)}};options();
</script></html>
