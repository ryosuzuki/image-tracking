<!doctype html><title>Ten ID synthetic test</title><canvas width="1280" height="960"></canvas><script type="module">import {contract,drawTargets,drawPaper} from './targets.mjs';import {ColoredDotsTracker} from './colored-dots.mjs';const c=document.querySelector('canvas'),ctx=c.getContext('2d'),tracker=new ColoredDotsTracker(contract);window.runTests=()=>{const results=[...contract.markers.map(m=>m.id),'all','blank'].map(id=>{const expected=id==='blank'?[]:drawTargets(c,id);if(id==='blank'){ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height)}const start=performance.now(),ids=tracker.detect(ctx.getImageData(0,0,c.width,c.height)).map(o=>o.id).sort((a,b)=>a-b);return {target:id,expected,ids,pass:JSON.stringify(ids)===JSON.stringify(expected),ms:performance.now()-start}});let seed=103;const random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};for(let n=0;n<20;n++){ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);if(n<10){for(let i=0;i<120;i++){ctx.fillStyle=contract.palette[Math.floor(random()*4)].hex;ctx.beginPath();ctx.arc(10+random()*1260,10+random()*940,3+random()*9,0,Math.PI*2);ctx.fill()}}else{drawPaper(ctx,{id:99,cornerCodes:Array.from({length:4},()=>Array.from({length:7},()=>Math.floor(random()*4)))},300,160,650)}const ids=tracker.detect(ctx.getImageData(0,0,c.width,c.height)).map(o=>o.id);results.push({target:n<10?'random-dots-negative':'unregistered-code-negative',ids,pass:ids.length===0})}for(const erased of [2,3]){ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);drawPaper(ctx,contract.markers[0],300,160,650);for(let i=0;i<erased;i++){const f=contract.cornerFrames[i],s=650/.14;ctx.fillStyle='white';ctx.fillRect(300+s*(.01+f.center[0])-(i===1||i===2?150:20),160+s*(.01+f.center[1])-(i>=2?150:20),170,170)}const ids=tracker.detect(ctx.getImageData(0,0,c.width,c.height)).map(o=>o.id),expected=erased===2?[7]:[];results.push({target:`${4-erased}-corner-visible`,ids,expected,pass:JSON.stringify(ids)===JSON.stringify(expected)})}return results};window.ready=true;</script>
