<!doctype html><title>Ten ID synthetic test</title><canvas width="1280" height="960"></canvas><script type="module">import {contract,drawTargets} from './targets.mjs';import {ColoredDotsTracker} from './colored-dots.mjs';const c=document.querySelector('canvas'),ctx=c.getContext('2d'),tracker=new ColoredDotsTracker(contract);window.runTests=()=>[...contract.markers.map(m=>m.id),'all','blank'].map(id=>{const expected=id==='blank'?[]:drawTargets(c,id);if(id==='blank'){ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height)}const start=performance.now(),ids=tracker.detect(ctx.getImageData(0,0,c.width,c.height)).map(o=>o.id).sort((a,b)=>a-b);return {target:id,expected,ids,pass:JSON.stringify(ids)===JSON.stringify(expected),ms:performance.now()-start}});window.ready=true;</script>
