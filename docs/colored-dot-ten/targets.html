<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ten colored-dot paper targets</title><style>body{margin:0;background:#707070;color:white;font:16px system-ui}header{padding:6px}button,select,a{font:inherit;margin:4px;padding:6px}a{color:#bdf}canvas{display:block;width:100vw;height:calc(100vh - 60px);object-fit:contain}</style><header><select id="selection"><option value="all">All ten together</option></select><button id="sequence">Ten sequential (4 seconds each)</button><button id="full">Fullscreen</button><a href="index.html">Camera test</a></header><canvas id="targets"></canvas><script type="module">import {contract,drawTargets} from './targets.mjs?v=two-corners-v1';const c=document.querySelector('canvas'),sel=document.querySelector('select');let timer;window.targetFit=Math.max(.5,Math.min(1,Number(new URLSearchParams(location.search).get('fit'))||1));for(const m of contract.markers)sel.add(new Option(`Paper ${m.id-6} · ID ${m.id}`,m.id));window.showTarget=id=>{sel.value=String(id);c.width=innerWidth;c.height=innerHeight-60;window.expectedIds=drawTargets(c,sel.value);return window.expectedIds};sel.onchange=()=>{clearInterval(timer);showTarget(sel.value)};window.onresize=()=>showTarget(sel.value);document.querySelector('#full').onclick=()=>document.documentElement.requestFullscreen();document.querySelector('#sequence').onclick=()=>{clearInterval(timer);let i=0;showTarget(contract.markers[0].id);timer=setInterval(()=>{i++;if(i===10){clearInterval(timer);showTarget('all')}else showTarget(contract.markers[i].id)},4000)};showTarget(new URLSearchParams(location.search).get('id')||'all');</script></html>
