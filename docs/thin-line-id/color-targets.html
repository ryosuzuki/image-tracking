<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>細い色線ID 30枚</title><style>body{font:16px system-ui;background:#222;color:white;margin:12px}button,select{padding:10px}#cards{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:8px}canvas{width:100%;background:white;max-height:86vh;object-fit:contain}a{color:#9df}@media print{body{background:white}header{display:none}#cards{display:block}canvas{display:block;width:180mm;height:250mm;break-after:page}}</style><header><h1>黒L字＋上辺の細い色線：30 ID</h1><p>線幅は紙幅の1.25%（A4換算2.6mm）。6本のデータ＋1本のチェック。黒い開始・終了印。本文の画像照合なし。まず1枚を大きく映してください。</p><select id="mode"><option value="1">1枚</option><option value="10">10枚</option><option value="30">30枚一覧</option></select><select id="id"></select><button id="next">次</button><button onclick="window.print()">印刷</button><a href="color-camera.html">カメラ</a></header><main id="cards"></main><script type="module">import{CODEBOOK,drawCard,setCodebook}from'./color-code.mjs';const mode=document.querySelector('#mode'),id=document.querySelector('#id'),cards=document.querySelector('#cards');CODEBOOK.forEach((c,i)=>id.add(new Option(c.id,i)));let q=new URLSearchParams(location.search);setCodebook(q.get('book')); mode.value=q.get('count')||'1';id.value=q.get('id')||'0';function draw(){cards.innerHTML='';let n=+mode.value;cards.style.setProperty('--cols',n===1?1:n===10?5:6);for(let i=0;i<n;i++){let c=document.createElement('canvas');drawCard(c,n===1?+id.value:i,{dual:q.get('dual')==='1',lineHeight:Number(q.get('thickness')||8),lineLength:Number(q.get('length')||40),...(q.get('palette')==='vivid'?{palette:['#ff0018','#0055ff','#ffc800','#00a64f']}: {})});cards.append(c)}if(q.get('demo')==='1'){document.querySelector('header').style.display='none';document.body.style.margin='0';cards.style.height='100vh';cards.querySelectorAll('canvas').forEach(c=>{c.style.height=(n===1?96:47)+'vh';c.style.maxHeight='none'})}}mode.onchange=id.onchange=draw;document.querySelector('#next').onclick=()=>{id.value=(+id.value+1)%30;draw()};draw();window.colorTargets={drawCard,CODEBOOK,draw};</script></html>
