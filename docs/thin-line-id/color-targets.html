<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>30 Thin Colored-Line ID Cards</title><style>body{font:16px system-ui;background:#222;color:white;margin:12px}button,select{padding:10px}#cards{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:8px}canvas{width:100%;background:white;max-height:86vh;object-fit:contain}a{color:#9df}@media print{body{background:white}header{display:none}#cards{display:block}canvas{display:block;width:180mm;height:250mm;break-after:page}}</style><header><h1>Black L Corners and Thin Top-Edge Colored Lines: 30 IDs</h1><p>Line thickness is 1.25% of paper width (2.6 mm for A4). Six data segments plus one checksum segment, with black start/end marks. No interior image matching. Start with a large view of one card.</p><select id="mode"><option value="1">1 card</option><option value="10">10 cards</option><option value="30">30-card grid</option></select><select id="id"></select><button id="next">Next</button><button onclick="window.print()">Print</button><a href="color-camera.html">Camera</a></header><main id="cards"></main><script type="module">import{CODEBOOK,drawCard,setCodebook,configurePalette}from'./color-code.mjs?v=iter-20261010-j';const mode=document.querySelector('#mode'),id=document.querySelector('#id'),cards=document.querySelector('#cards');CODEBOOK.forEach((c,i)=>id.add(new Option(c.id,i)));let q=new URLSearchParams(location.search);setCodebook(q.get('book'));const selectedPalette=configurePalette(q.get('palette'));if(q.get('book')==='eight')document.querySelector('header p').textContent='Eight colored segments and a registered 30-ID codebook. Observed colors are unchanged; only up to three missing segments are restored.';if(q.get('sides')==='1')document.querySelector('header p').textContent+=' The same thin colored lines are also added to the left and right edges (using extra ink).';document.querySelector('a').href='color-camera.html?'+q.toString(); mode.value=q.get('count')||'1';id.value=q.get('id')||'0';function draw(){cards.innerHTML='';let n=+mode.value;cards.style.setProperty('--cols',n===1?1:n===10?5:6);for(let i=0;i<n;i++){let c=document.createElement('canvas');drawCard(c,n===1?+id.value:i,{dual:q.get('dual')==='1',sides:q.get('sides')==='1',lineHeight:Number(q.get('thickness')||8),lineLength:Number(q.get('length')||40),...(selectedPalette?{palette:selectedPalette}:q.get('palette')==='vivid'?{palette:['#ff0018','#0055ff','#ffc800','#00a64f']}: {})});cards.append(c)}if(q.get('demo')==='1'){document.querySelector('header').style.display='none';document.body.style.margin='0';cards.style.height='auto';cards.style.marginTop=(Number(q.get('margin')||0))+'px';if(q.has('fit')){cards.style.width=(Math.max(.1,Math.min(1,Number(q.get('fit'))))*100)+'vw';cards.style.marginLeft='auto';cards.style.marginRight='auto';}if(q.has('shift'))cards.style.transform='translateX('+Number(q.get('shift'))+'px)';cards.querySelectorAll('canvas').forEach(c=>{c.style.height=(n===1?96:47)+'vh';c.style.maxHeight='none'})}}mode.onchange=id.onchange=draw;document.querySelector('#next').onclick=()=>{id.value=(+id.value+1)%30;draw()};draw();window.colorTargets={drawCard,CODEBOOK,draw,setCodebook};</script></html>
