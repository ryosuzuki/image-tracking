<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Content Targets</title><style>body{font:18px system-ui;background:#394150;color:white;text-align:center}button,input,select{font:inherit;padding:10px;margin:5px}canvas{width:90vw;max-width:1000px;background:#bbb}a{color:#7dd3fc}</style><h1>Display this on MacBook Air</h1><select id="example"><option>SUN</option><option>TREE</option><option>MUSIC</option><option>12 + 30</option></select><input id="text" value="SUN" aria-label="Paper writing"><button id="full">Fullscreen</button><button id="download">Download PNG</button><p>Pixel: select the L-corner sheet, then press Read. Change the writing and press Read again.</p><canvas id="target" width="1000" height="700"></canvas><p><a href="index.html">Pixel camera / OCR</a></p><p>English printed text and clear block capitals. You can also draw four medium black L corners on real paper and write SUN, TREE, MUSIC, or arithmetic inside.</p><script>const c=document.querySelector('canvas'),x=c.getContext('2d'),input=document.querySelector('#text');function draw(){x.fillStyle='#667085';x.fillRect(0,0,1000,700);x.fillStyle='white';x.fillRect(120,100,760,500);x.strokeStyle='black';x.lineWidth=14;x.lineCap='butt';for(const [a,b,s,t] of [[145,125,1,1],[855,125,-1,1],[855,575,-1,-1],[145,575,1,-1]]){x.beginPath();x.moveTo(a+s*65,b);x.lineTo(a,b);x.lineTo(a,b+t*65);x.stroke()}x.fillStyle='black';x.textAlign='center';x.textBaseline='middle';x.font='bold 80px Arial';x.fillText(input.value,500,350,620)}input.oninput=draw;document.querySelector('#example').onchange=e=>{input.value=e.target.value;draw()};document.querySelector('#full').onclick=()=>c.requestFullscreen();document.querySelector('#download').onclick=()=>{const a=document.createElement('a');a.download='paper-content-target.png';a.href=c.toDataURL();a.click()};draw()</script></html>
