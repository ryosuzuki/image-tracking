<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper tracking display targets</title><style>body{margin:0;background:#777;color:white;font:16px system-ui}#controls{padding:8px;background:#222}select,button,a{font:inherit;margin:4px;padding:8px}a{color:#7df}img{display:block;width:100vw;height:calc(100vh - 90px);object-fit:contain}body.move img{animation:move 5s infinite ease-in-out}@keyframes move{0%,100%{transform:rotate(-5deg) scale(.95) translateX(-2%)}50%{transform:rotate(5deg) scale(.85) translateX(2%)}}</style><div id="controls"><select id="method"><option value="l">Four L</option><option value="dots">Colored dots</option></select><select id="count"><option>2</option><option>4</option></select><select id="size"><option>large</option><option>medium</option><option>small</option></select><button id="motion">Motion on/off</button><button id="full">Fullscreen</button><a id="download" download>Download SVG</a><a id="png" download>Download PNG</a></div><img id="target"><script>function update(){const name=`${method.value}-${count.value}-${size.value}.svg`;target.src=name;download.href=name;png.href=name.replace(".svg",".png")}for(const x of [method,count,size])x.onchange=update;motion.onclick=()=>document.body.classList.toggle('move');full.onclick=()=>document.documentElement.requestFullscreen();update();</script></html>
