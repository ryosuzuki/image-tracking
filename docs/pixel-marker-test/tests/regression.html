<!doctype html><meta charset="utf-8"><title>L corner regression</title><canvas id="test" width="960" height="720"></canvas><script>window.cvReadyPromise=new Promise(r=>window.onCvReady=r)</script><script async src="https://docs.opencv.org/4.x/opencv.js" onload="(async()=>{if(cv instanceof Promise)cv=await cv;if(cv.Mat)onCvReady();else cv.onRuntimeInitialized=onCvReady})()"></script><script type="module">
import {detectLCorners} from '../l-corners.mjs';await window.cvReadyPromise;
window.runCase=({count=4,rotate=0,skew=0,background='white',noise=false,blur=0,perspective=false})=>{const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');ctx.fillStyle=background;ctx.fillRect(0,0,960,720);ctx.filter=`blur(${blur}px)`;for(let i=0;i<count;i++){const cx=count===1?480:250+(i%2)*460,cy=count<3?360:190+Math.floor(i/2)*340;ctx.save();ctx.translate(cx,cy);ctx.rotate(rotate);ctx.transform(1,0,skew,1,0,0);ctx.fillStyle='white';ctx.fillRect(-160,-120,320,240);ctx.strokeStyle='black';ctx.lineWidth=10;for(const [x,y,sx,sy] of [[-140,-100,1,1],[140,-100,-1,1],[140,100,-1,-1],[-140,100,1,-1]]){ctx.beginPath();ctx.moveTo(x+sx*40,y);ctx.lineTo(x,y);ctx.lineTo(x,y+sy*40);ctx.stroke()}ctx.restore()}ctx.filter='none';if(noise){ctx.strokeStyle='black';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(60,35);ctx.lineTo(25,35);ctx.lineTo(25,70);ctx.stroke();ctx.fillStyle='black';ctx.fillText('EXTRA TEXT 123',360,25)}const rgba=cv.imread(canvas),gray=new cv.Mat();if(perspective){const a=cv.matFromArray(4,1,cv.CV_32FC2,[0,0,960,0,960,720,0,720]),b=cv.matFromArray(4,1,cv.CV_32FC2,[100,80,850,0,930,660,20,710]),h=cv.getPerspectiveTransform(a,b),warped=new cv.Mat();cv.warpPerspective(rgba,warped,h,new cv.Size(960,720),cv.INTER_LINEAR,cv.BORDER_CONSTANT,new cv.Scalar(255,255,255,255));warped.copyTo(rgba);a.delete();b.delete();h.delete();warped.delete()}cv.cvtColor(rgba,gray,cv.COLOR_RGBA2GRAY);const q=detectLCorners(gray);rgba.delete();gray.delete();return {count:q.length,quads:q}};window.runAll=()=>{const results=[];for(const count of [1,2,4])for(const v of [{},{rotate:.25},{skew:.25},{perspective:true},{noise:true},{blur:1.2},{background:'#888'}]){const r=runCase({count,...v});results.push({count,...v,detected:r.count,pass:r.count===count})}return results};window.ready=true;
</script>
