<!doctype html><meta charset="utf-8"><title>Color dash ID regression</title><pre id="result">Loading OpenCV…</pre><script>window.cvReadyPromise=new Promise(r=>window.onCvReady=r)</script><script async src="https://docs.opencv.org/4.x/opencv.js" onload="(async()=>{if(cv instanceof Promise)cv=await cv;if(cv.Mat)onCvReady();else cv.onRuntimeInitialized=onCvReady})()"></script><script type="module">import{drawCard,CODEBOOK,decodeSymbols,classify}from'./color-code.mjs';import{recognize}from'./color-detector.mjs';await cvReadyPromise;const results=[];function check(name,ok,actual){results.push({name,ok,actual})}let canvas=document.createElement('canvas');for(let i=0;i<30;i++){drawCard(canvas,i);let r=recognize(canvas);check('ID '+i,r.length===1&&r[0].id===CODEBOOK[i].id,r.map(x=>x.id))}drawCard(canvas,9,{content:false});check('blank interior',recognize(canvas)[0]?.id===CODEBOOK[9].id);drawCard(canvas,9,{corrupt:true});check('ambiguous gray symbol rejected',recognize(canvas).length===0);for(let angle of [90,180,270]){drawCard(canvas,7);let dst=document.createElement('canvas');dst.width=angle===180?640:880;dst.height=angle===180?880:640;let c=dst.getContext('2d');c.translate(dst.width/2,dst.height/2);c.rotate(angle*Math.PI/180);c.drawImage(canvas,-320,-440);check('rotation '+angle,recognize(dst)[0]?.id===CODEBOOK[7].id)}let blank=document.createElement('canvas');blank.width=640;blank.height=880;blank.getContext('2d').fillStyle='white';blank.getContext('2d').fillRect(0,0,640,880);check('blank rejected',recognize(blank).length===0);drawCard(canvas,4);canvas.getContext('2d').fillStyle='white';canvas.getContext('2d').fillRect(0,0,80,90);check('missing L rejected',recognize(canvas).length===0);let min=7;for(let a of CODEBOOK)for(let b of CODEBOOK)if(a!==b)min=Math.min(min,a.symbols.reduce((s,x,k)=>s+(x!==b.symbols[k]),0));check('codebook minimum distance 3',min>=3,min);let corruptOK=true;for(let a of CODEBOOK)for(let k=0;k<7;k++)for(let t=1;t<4;t++){let b=a.symbols.slice();b[k]=(b[k]+t)%4;if(decodeSymbols(b))corruptOK=false;}check('630 one-symbol substitutions rejected',corruptOK);check('gray white black colors rejected',[[120,120,120],[255,255,255],[0,0,0]].every(c=>classify(c)===null));window.testResults={passed:results.filter(x=>x.ok).length,total:results.length,results};document.querySelector('#result').textContent=JSON.stringify(window.testResults,null,2);</script>
