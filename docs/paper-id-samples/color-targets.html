<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>30 Colored-Dash ID Cards</title><style>body{font:16px system-ui;background:#222;color:white;margin:12px}button,select{padding:10px}#cards{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:8px}canvas{width:100%;background:white;max-height:86vh;object-fit:contain}a{color:#9df}@media print{body{background:white}header{display:none}#cards{display:block}canvas{display:block;width:180mm;height:250mm;break-after:page}}</style><header><h1>Black L Corners and Top-Edge Colored Dashes: 30 IDs</h1><p>Six data segments plus one checksum segment, with black start/end marks. No interior image matching. Start with a large view of one card.</p><select id="mode"><option value="1">1 card</option><option value="10">10 cards</option><option value="30">30-card grid</option></select><select id="id"></select><button id="next">Next</button><button onclick="window.print()">Print</button><a href="color-camera.html">Camera</a></header><main id="cards"></main><script type="module">import{CODEBOOK,drawCard}from'./color-code.mjs';const mode=document.querySelector('#mode'),id=document.querySelector('#id'),cards=document.querySelector('#cards');CODEBOOK.forEach((c,i)=>id.add(new Option(c.id,i)));let q=new URLSearchParams(location.search);mode.value=q.get('count')||'1';id.value=q.get('id')||'0';function draw(){cards.innerHTML='';let n=+mode.value;cards.style.setProperty('--cols',n===1?1:n===10?5:6);for(let i=0;i<n;i++){let c=document.createElement('canvas');drawCard(c,n===1?+id.value:i);cards.append(c)}}mode.onchange=id.onchange=draw;document.querySelector('#next').onclick=()=>{id.value=(+id.value+1)%30;draw()};draw();window.colorTargets={drawCard,CODEBOOK,draw};</script></html>
