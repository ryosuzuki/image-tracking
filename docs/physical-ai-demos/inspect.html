<!doctype html><html lang="en"><meta charset="utf-8"><title>Recorded Output Inspector</title><style>body{font:17px/1.65 system-ui;background:#0b1424;color:#eaf0ff;max-width:1100px;margin:35px auto;padding:20px}a{color:#99d8ff}video{width:100%;background:black}pre{background:#17283c;padding:20px;border-radius:12px;white-space:pre-wrap}input{width:100%}h1{line-height:1.2}.warn{color:#ecca87}</style><a href="./">← Five-demo hub</a><h1 id="title"></h1><p class="warn">Recorded output inspection only. Seeking does not rerun inference or simulation.</p><video controls id="video" preload="metadata"></video><p>Recorded source frame: <b id="n">0</b></p><input type="range" id="seek" min="0" value="0"><pre id="trace">Loading authentic trace…</pre><p id="scope"></p><script>
const requested=new URLSearchParams(location.search).get('demo');const demo=['stretch','robot'].includes(requested)?requested:'openpilot';document.querySelector('#title').textContent=demo==='robot'?'Recorded vision-language planner — inspect the actual decisions':demo==='stretch'?'Stretch 4 — Command, State and Contact':'openpilot — Recorded Input and Predicted Geometry';const v=document.querySelector('#video');v.src='media/'+demo+'.mp4';let rows=[];const seek=document.querySelector('#seek');fetch('inspect-data/'+demo+'.json').then(r=>r.json()).then(d=>{rows=Array.isArray(d)?d:[d];seek.max=rows.length-1;show(0)});function show(i){i=Math.min(rows.length-1,Math.max(0,i));document.querySelector('#n').textContent=i;seek.value=i;document.querySelector('#trace').textContent=JSON.stringify(rows[i],null,2)}seek.oninput=()=>{const i=+seek.value;show(i);if(demo==='robot')return;v.currentTime=demo==='stretch'?i/15:(i/20-6+3);};v.ontimeupdate=()=>{if(demo==='robot')return;show(Math.round(demo==='stretch'?v.currentTime*15:(Math.max(0,v.currentTime-3)+6)*20));};document.querySelector('#scope').textContent=demo==='robot'?'Actual recorded API decision trace. The trace slider selects an event, not a synchronized video timestamp. No new API requests are made.':demo==='stretch'?'The trace reports the maximum normal force across robot–table contact points, not a summed wrench. Simulation timestep: 2 ms; recorded source frames: 15 Hz.':'The route was processed at 20 Hz with 120 warmup frames. The clip contains a 3-second introduction and starts at source time 6 s. Geometry below is actual selected model output, not manually drawn trajectories.';
</script></html>
